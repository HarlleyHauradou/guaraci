[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
guaraci-units = { path = "crates/guaraci-units" }
guaraci-input = { path = "crates/guaraci-input" }
guaraci-data = { path = "crates/guaraci-data" }
guaraci-core = { path = "crates/guaraci-core" }
guaraci-cpu = { path = "crates/guaraci-cpu" }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
strsim = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
