name: docs

# Builds the documentation in English, Portuguese and Spanish and publishes it
# on GitHub Pages: https://harlleyhauradou.github.io/guaraci/

on:
  push:
    branches: [main]
    paths: ["docs/**", "PHILOSOPHY.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: English
        run: sphinx-build -W --keep-going docs site/en
      - name: Português
        run: sphinx-build -W --keep-going -D language=pt_BR docs site/pt-br
      - name: Español
        run: sphinx-build -W --keep-going -D language=es docs site/es
      - run: cp docs/_static/root-index.html site/index.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
