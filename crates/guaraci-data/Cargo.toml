[package]
name = "guaraci-data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nuclear and atomic data for Guaraci: ENDF-6 reader, download, local cache"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror.workspace = true
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
dirs = "5"
