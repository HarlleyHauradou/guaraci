# Read the Docs configuration.
# The same configuration serves the three projects (English, Portuguese and
# Spanish); Read the Docs builds each one with the language set in the project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
